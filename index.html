<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#020104" />
  <title>Black Hole Animation</title>
  <meta name="description" content="Animasi black hole layar penuh dengan HTML dan CSS." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="space" aria-label="Animasi black hole di luar angkasa">
    <div class="stars stars-small" aria-hidden="true"></div>
    <div class="stars stars-medium" aria-hidden="true"></div>
    <div class="stars stars-large" aria-hidden="true"></div>

    <div class="scene" aria-hidden="true">
      <div class="outer-glow"></div>
      <div class="accretion-disk disk-back"></div>
      <div class="photon-ring"></div>
      <div class="black-hole"></div>
      <div class="accretion-disk disk-front"></div>
      <div class="light-beam"></div>
      <div class="hot-spot"></div>
    </div>

    <div class="vignette" aria-hidden="true"></div>
  </main>
</body>
</html>
